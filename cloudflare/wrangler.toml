name = "pz-ranking"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Dominio proprio (a zona simpless.com.br ja esta na Cloudflare). Precisa ficar antes das tabelas abaixo.
routes = [{ pattern = "pz.simpless.com.br", custom_domain = true }]

# Pagina estatica (index.html) servida como asset
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"

# Onde o data.json fica guardado
[[kv_namespaces]]
binding = "DADOS"
id = "7d120c84bed043acb347bfe4de4cf234"
