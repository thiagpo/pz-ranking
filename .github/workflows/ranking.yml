name: atualiza

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: atualiza
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q paramiko
      - env:
          PZ_CONFIG: ${{ secrets.PZ_CONFIG }}
        run: python atualiza_ranking.py
