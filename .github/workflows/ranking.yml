name: Atualiza ranking

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paramiko
      - name: Baixa dados do servidor, gera e envia para pz.simpless.com.br
        env:
          PZ_SFTP_PASSWORD: ${{ secrets.PZ_SFTP_PASSWORD }}
          PZ_UPLOAD_TOKEN: ${{ secrets.PZ_UPLOAD_TOKEN }}
        run: python atualiza_ranking.py
